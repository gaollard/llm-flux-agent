name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:mac
        if: runner.os == 'macOS'
      - run: npm run dist:win
        if: runner.os == 'Windows'
      - uses: actions/upload-artifact@v4
        with:
          name: flux-${{ runner.os }}
          path: release/**
